<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | WordMate</title>
    <link rel="icon" type="image/svg+xml" href="../../../public/image/wordmate-logo.svg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter (hỗ trợ tiếng Việt đầy đủ) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/components/header.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
</head>

<body>
    <!-- ===== HEADER COMPONENT PLACEHOLDER ===== -->
    <!-- Header sẽ được load từ component dùng chung -->
    <div id="header">
        <!-- Header component sẽ được inject vào đây -->
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">
        
        <!-- ===== DASHBOARD CONTAINER ===== -->
        <div class="dashboard-container">
            
            <!-- ===== DASHBOARD HEADER ===== -->
            <div class="dashboard-header">
                <h1 class="dashboard-title">Tên roadmap</h1>
                <!-- <p class="dashboard-subtitle">Chọn chủ đề để bắt đầu học tập</p> -->
            </div>

            <!-- ===== TOPIC SECTION ===== -->
            <section class="topic-section">
                <div class="section-header">
                    <h2 class="section-title">Chủ Đề Học Tập</h2>
                    <span class="topic-count">0 chủ đề</span>
                </div>

                <!-- ===== TOPIC GRID ===== -->
                <div class="topic-grid">
                    <!-- Render bằng dashboard.js -->
                </div>
            </section>

        </div>
        <!-- ===== END DASHBOARD CONTAINER ===== -->

    </main>
    <!-- ===== END MAIN CONTENT ===== -->

    <!-- ===== AI CHAT PLACEHOLDER ===== -->
    <!-- AI Chat Component sẽ được load từ component dùng chung -->
    <div id="ai-chat-placeholder" class="ai-chat-placeholder">
        <!-- AI Chat component sẽ được inject vào đây -->
    </div>

    <!-- ===== BOTTOM NAVIGATION PLACEHOLDER ===== -->
    <!-- Bottom Navigation sẽ được load từ component dùng chung -->
    <div id="bottom-nav">
        <!-- Bottom Navigation component sẽ được inject vào đây -->
    </div>

    <!-- ===== TOAST CONTAINER ===== -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="../../js/pages/dashboard.js"></script>

</body>

</html>
