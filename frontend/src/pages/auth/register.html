<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản | WordMate</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter (hỗ trợ tiếng Việt đầy đủ) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/pages/register.css">
</head>

<body>

    <!-- ===== LAYOUT: Full-page centered container ===== -->
    <div class="register-page d-flex align-items-center justify-content-center min-vh-100" style="font-family: 'Inter', sans-serif">

        <!-- ===== CARD: Registration Card ===== -->
        <div class="register-card">

            <!-- Logo -->
            <div class="register-logo">
                <div class="logo-placeholder">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <img class="logo-image" src="" alt="WordMate Logo">
                <span>WordMate</span>
            </div>

            <!-- Title -->
            <h1 class="register-title">Create Account</h1>

            <!-- Description -->
            <p class="register-desc">Start your vocabulary learning journey with WordMate</p>

            <!-- ===== FORM ===== -->
            <form id="registerForm" novalidate>

                <!-- Fullname -->
                <div class="register-field">
                    <label for="fullname" class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input
                            type="text"
                            class="form-control"
                            id="fullname"
                            placeholder="Enter your full name"
                            required
                            autocomplete="name"
                        >
                    </div>
                    <div class="invalid-feedback">Please enter your full name.</div>
                </div>

                <!-- Username -->
                <div class="register-field">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-at"></i></span>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            placeholder="Choose a username"
                            required
                            autocomplete="username"
                        >
                    </div>
                    <div class="invalid-feedback">Please choose a username.</div>
                </div>

                <!-- Email -->
                <div class="register-field">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Enter your email"
                            required
                            autocomplete="email"
                        >
                    </div>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <!-- Password -->
                <div class="register-field">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Create a password (min. 8 characters)"
                            required
                            minlength="8"
                            autocomplete="new-password"
                        >
                        <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="-1">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback">Password must be at least 8 characters.</div>
                </div>

                <!-- Message display area -->
                <div id="message" class="register-message" role="alert"></div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="register-btn btn btn-primary w-100"
                    id="registerBtn"
                >
                    <span class="btn-text">Register</span>
                    <span class="btn-spinner d-none">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        Creating account...
                    </span>
                </button>

            </form>
            <!-- ===== END FORM ===== -->

            <!-- ===== FOOTER: Login link ===== -->
            <div class="register-footer">
                Already have an account?
                <a href="../auth/login.html" class="register-link">Login</a>
            </div>

        </div>
        <!-- ===== END CARD ===== -->

    </div>
    <!-- ===== END LAYOUT ===== -->


    <!-- ===== SCRIPTS ===== -->

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Toggle Password Visibility -->
    <script>
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.closest('.input-group').querySelector('input');
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });
    </script>

    <!-- Form Validation & Submission -->
    <script>
        (function() {
            const form = document.getElementById('registerForm');
            const messageEl = document.getElementById('message');
            const submitBtn = document.getElementById('registerBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const btnSpinner = submitBtn.querySelector('.btn-spinner');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Clear previous message
                messageEl.textContent = '';
                messageEl.className = 'register-message';
                form.classList.remove('was-validated');

                // Bootstrap validation
                if (!form.checkValidity()) {
                    form.classList.add('was-validated');
                    return;
                }

                // Show loading state
                submitBtn.disabled = true;
                btnText.classList.add('d-none');
                btnSpinner.classList.remove('d-none');

                const fullname = document.getElementById('fullname').value.trim();
                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                try {
                    const response = await fetch('http://localhost:5000/api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            fullname,
                            username,
                            email,
                            password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        messageEl.textContent = data.message || 'Registration successful!';
                        messageEl.className = 'register-message register-message--success';
                        // Optionally redirect after success
                        // setTimeout(() => { window.location.href = '../auth/login.html'; }, 1500);
                    } else {
                        messageEl.textContent = data.message || 'Registration failed. Please try again.';
                        messageEl.className = 'register-message register-message--error';
                    }

                } catch (error) {
                    console.error('Lỗi:', error);
                    messageEl.textContent = 'Network error. Please check your connection and try again.';
                    messageEl.className = 'register-message register-message--error';
                } finally {
                    // Restore button state
                    submitBtn.disabled = false;
                    btnText.classList.remove('d-none');
                    btnSpinner.classList.add('d-none');
                }

            });
        })();
    </script>

</body>

</html>
