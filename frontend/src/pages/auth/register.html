<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản | WordMate</title>
    <link rel="icon" type="image/svg+xml" href="../../../public/image/wordmate-logo.svg">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter (hỗ trợ tiếng Việt đầy đủ) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/pages/register.css">
</head>

<body>

    <!-- ===== LAYOUT: Full-page centered container ===== -->
    <div class="register-page d-flex align-items-center justify-content-center min-vh-100" style="font-family: 'Inter', sans-serif">

        <!-- ===== CARD: Registration Card ===== -->
        <div class="register-card">

            <!-- Logo -->
            <div class="register-logo">       
                <img class="logo-image" src="../../../public/image/wordmate-name.svg" width="80" height="80" alt="WordMate Logo">
                <span style="color:rgba(255, 217, 0, 0.822)">WordMate</span>
            </div>

            <!-- Title -->
            <h1 class="register-title">Đăng ký</h1>

            <!-- Description -->
            <p class="register-desc">Bắt đầu hành trình học từ vựng với WordMate</p>

            <!-- ===== FORM ===== -->
            <form id="registerForm" novalidate>

                <!-- Fullname -->
                <div class="register-field">
                    <label for="fullname" class="form-label">Họ và Tên</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input
                            type="text"
                            class="form-control"
                            id="fullname"
                            placeholder="Nhập họ và tên"
                            required
                            autocomplete="name"
                        >
                    </div>
                    <div class="invalid-feedback">Vui lòng nhập họ và tên.</div>
                </div>

                <!-- Username -->
                <div class="register-field">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-at"></i></span>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            placeholder="Chọn tên đăng nhập"
                            required
                            autocomplete="username"
                        >
                    </div>
                    <div class="invalid-feedback">Vui lòng chọn tên đăng nhập.</div>
                </div>

                <!-- Email -->
                <div class="register-field">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Nhập email của bạn"
                            required
                            autocomplete="email"
                        >
                    </div>
                    <div class="invalid-feedback">Vui lòng nhập email hợp lệ.</div>
                </div>

                <!-- Password -->
                <div class="register-field">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Tạo mật khẩu (tối thiểu 8 ký tự)"
                            required
                            minlength="8"
                            autocomplete="new-password"
                        >
                        <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="-1">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback">Mật khẩu phải có ít nhất 8 ký tự.</div>
                </div>

                <!-- Confirm Password -->
                <div class="register-field">
                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            placeholder="Xác nhận mật khẩu của bạn"
                            required
                            autocomplete="new-password"
                        >
                        <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="-1">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback">Mật khẩu không khớp.</div>
                </div>

                <!-- Message display area -->
                <div id="message" class="register-message" role="alert"></div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="register-btn btn btn-primary w-100"
                    id="registerBtn"
                >
                    <span class="btn-text">Đăng ký</span>
                    <span class="btn-spinner d-none">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        Đang tạo tài khoản...
                    </span>
                </button>

            </form>
            <!-- ===== END FORM ===== -->

            <div class="register-divider">
                <span>or</span>
            </div>
            <!-- ===== FOOTER: Login link ===== -->
            <div class="register-footer">
                Bạn đã có tài khoản?
                <a href="../auth/login.html" class="register-link">Đăng nhập</a>
            </div>

        </div>
        <!-- ===== END CARD ===== -->

    </div>
    <!-- ===== END LAYOUT ===== -->


    <!-- ===== SCRIPTS ===== -->

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Toggle Password Visibility -->
    <script>
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.closest('.input-group').querySelector('input');
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });
    </script>

    <!-- Register Module -->
    <script type="module" src="../../js/pages/register.js"></script>

</body>

</html>
