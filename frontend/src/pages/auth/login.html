<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | WordMate</title>
    <link rel="icon" type="image/svg+xml" href="../../../public/image/wordmate-logo.svg">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter (hỗ trợ tiếng Việt đầy đủ) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/pages/login.css">
</head>

<body>

    <!-- ===== LAYOUT: Full-page centered container ===== -->
    <div class="login-page d-flex align-items-center justify-content-center min-vh-100" style="font-family: 'Inter', sans-serif">

        <!-- ===== CARD: Login Card ===== -->
        <div class="login-card">

            <!-- Logo -->
            <div class="login-logo">
                <div class="logo-placeholder">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <img class="logo-image" src="../../../public/image/wordmate-name.svg" width="80" height="80" alt="WordMate Logo">
                <span>WordMate</span>
            </div>

            <!-- Title -->
            <h1 class="login-title">Welcome Back</h1>

            <!-- Description -->
            <p class="login-desc">Continue your vocabulary journey.</p>

            <!-- ===== FORM ===== -->
            <form id="loginForm" novalidate>

                <!-- Email -->
                <div class="login-field">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Enter your email"
                            required
                            autocomplete="email"
                        >
                    </div>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <!-- Password -->
                <div class="login-field">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button class="btn btn-outline-secondary toggle-password" type="button" tabindex="-1">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="login-options">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" tabindex="-1">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <!-- Message display area -->
                <div id="message" class="login-message" role="alert"></div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="login-btn btn btn-primary w-100"
                    id="loginBtn"
                >
                    <span class="btn-text">Sign In</span>
                    <span class="btn-spinner d-none">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        Signing in...
                    </span>
                </button>

            </form>
            <!-- ===== END FORM ===== -->

            <!-- ===== DIVIDER ===== -->
            <div class="login-divider">
                <span>or</span>
            </div>

            <!-- ===== FOOTER: Register link ===== -->
            <div class="login-footer">
                Don't have an account?
                <a href="../auth/register.html" class="login-link">Register</a>
            </div>

        </div>
        <!-- ===== END CARD ===== -->

    </div>
    <!-- ===== END LAYOUT ===== -->


    <!-- ===== SCRIPTS ===== -->

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Toggle Password Visibility -->
    <script>
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.closest('.input-group').querySelector('input');
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });
    </script>

    <!-- Login Form Validation & Submission -->
    <script type="module" src="../../js/pages/login.js"></script>

</body>

</html>
