<!-- ============================================================
     Header Component - WordMate
     Contains: Logo, Avatar, Streak, Admin Button
     ============================================================ -->
<header class="wm-header">
    <div class="header-container">
        <!-- Logo -->
        <div class="header-logo">
            <a href="../dashboard/dashboard.html" class="logo-link">
                <img class="logo-image" src="../../../public/image/logo-name-header.svg" width="200" height="48" alt="Logo header">
            </a>
        </div>

        <!-- Right Section: Admin Button + Avatar + Streak -->
        <div class="header-right">
            <!-- Admin Button (only visible for role="admin") -->
            <a href="../admin/admin.html" class="header-admin-btn" id="header-admin-btn">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Quản lý</span>
            </a>

            <!-- Streak Display -->
            <div class="header-streak" id="header-streak">
                <div class="streak-badge">
                    <i class="fa-solid fa-fire"></i>
                    <span class="streak-count">0</span>
                </div>
                <span class="streak-label">ngày</span>
            </div>

            <!-- Avatar Dropdown -->
            <div class="header-avatar-dropdown">
                <button class="avatar-button" id="avatar-button" aria-label="Menu người dùng">
                    <img id="header-avatar-img" src="" alt="Avatar" class="avatar-img">
                    <i class="fa-solid fa-chevron-down avatar-chevron"></i>
                </button>

                <!-- Dropdown Menu -->
                <div class="dropdown-menu" id="avatar-dropdown-menu">
                    <div class="dropdown-header">
                        <p class="dropdown-user-name" id="dropdown-user-name"></p>
                        <p class="dropdown-user-email" id="dropdown-user-email"></p>
                    </div>
                    <div class="dropdown-divider"></div>
                    <a href="../profile/profile.html" class="dropdown-item">
                        <i class="fa-solid fa-user"></i>
                        <span>Thông tin cá nhân</span>
                    </a>
                    <a href="../dashboard/onboarding.html" class="dropdown-item">
                        <i class="fa-solid fa-road"></i>
                        <span>Lộ trình học tập</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>

<script src="../js/components/header.js"></script>
