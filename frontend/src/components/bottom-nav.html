<style>
:root {
    /* Primary palette — Warm Gold */
    --wm-primary: #FFC300;
    --wm-primary-dark: #E6B000;
    --wm-primary-light: #FFD633;
    --wm-primary-bg: #FFF8E1;

    /* Semantic colors */
    --wm-success: #10B981;
    --wm-error: #F43F5E;

    /* Neutral palette */
    --wm-text-primary: #1E293B;
    --wm-text-secondary: #64748B;
    --wm-text-muted: #94A3B8;
    --wm-bg-page: #F8FAFC;
    --wm-bg-card: #FFFFFF;
    --wm-border: #E2E8F0;
    --wm-border-focus: #FFC300;

    /* Typography */
    --wm-font-family: 'Inter', 'Roboto', system-ui, -apple-system, sans-serif;

    /* Spacing */
    --wm-radius-sm: 8px;
    --wm-radius-md: 12px;
    --wm-radius-lg: 20px;
    --wm-radius-card: 24px;
    --wm-shadow-card: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);

    /* Transitions */
    --wm-transition-fast: 150ms ease;
    --wm-transition-base: 200ms ease;
    --wm-transition-slow: 300ms ease;
}

/* ----- Bottom Navigation ----- */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    border-top: 1px solid var(--wm-border);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0.5rem 0;
    padding-bottom: calc(0.5rem + env(safe-area-inset-bottom));
    z-index: 1000;
    box-shadow: 0 -15px 20px rgba(0, 0, 0, 0.05);
}

.bottom-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: var(--wm-text-muted);
    font-size: 0.7rem;
    font-weight: 500;
    font-family: var(--wm-font-family);
    transition: color var(--wm-transition-base);
    padding: 0.25rem 0.5rem;
    min-width: 60px;
}

.bottom-nav-item i {
    font-size: 1.3rem;
    margin-bottom: 0.15rem;
    transition: transform var(--wm-transition-base),
                color var(--wm-transition-base);
}

.bottom-nav-item.active {
    color: var(--wm-primary);
}

.bottom-nav-item:hover {
    color: var(--wm-primary);
} 


/* active */
.bottom-nav-item.active {
    color: var(--wm-primary);
    font-weight: 600;
}

.bottom-nav-item.active i {
    transform: scale(1.5) translateY(-11px);
}   

</style>
